name: Feature request
description: Suggest a new feature or a change to an existing one.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do, and what makes it hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you'd like it to work. Include an example of the API or the UI if you can.
