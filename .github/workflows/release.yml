name: Release

# Publishes to npm when you push a tag such as v0.2.0, then creates a GitHub
# release with that version's CHANGELOG.md entry as the notes.
# Uses npm trusted publishing: no npm token is stored in GitHub. Configure the
# trusted publisher on npmjs.com (package settings) with this repository,
# workflow file "release.yml", and environment "npm".

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # OIDC token for npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check npm supports trusted publishing
        run: |
          v=$(npm --version)
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$v" \
            || { echo "::error::npm $v is too old for trusted publishing (needs 11.5.1 or later)"; exit 1; }
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - name: Check the changelog has a dated entry
        run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" --dated > "$RUNNER_TEMP/notes.md"
      - run: npm ci
      # prepublishOnly runs the typecheck, tests, and build first.
      - run: npm publish --access public
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
